<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <title>Gestión de Libros - BiblioControl</title>
    <link rel="icon" href="../imagenes/logo.png" type="image/png" sizes="60x60">
    <link rel='stylesheet' href='../css/variables.css'>
    <link rel='stylesheet' href='../css/admin.css'>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="dashboard-container">
    <aside class="sidebar">
        <nav class="menu">
            <a href="admin.html" class="logo">
                <img src="../imagenes/isl.png" alt="Logo">
            </a>
            <ul class="menu-items">
                <li><a href="inicio-admin.html"><i class="fa-solid fa-house"></i> <span>Inicio</span></a></li>
                <li class="active"><a href="libros.html"><i class="fa-solid fa-book"></i> <span>Libros</span></a></li>
                <li><a href="usuarios.html"><i class="fa-solid fa-users"></i> <span>Usuarios</span></a></li>
                <li><a href="prestamos.html"><i class="fa-solid fa-arrows-rotate"></i> <span>Préstamos</span></a></li>
                <li><a href="reportes.html"><i class="fa-solid fa-chart-simple"></i> <span>Reportes</span></a></li>
                <li><a href="configuracion.html"><i class="fa-solid fa-gear"></i> <span>Configuración</span></a></li>
            </ul>
        </nav>
    </aside>

    <div class="dashboard-body">
        <main class="dashboard">
            <section class="content-area">
                <h2>Gestión de Libros</h2>
                <div class="section-header">
                    <h4><i class="fa-solid fa-plus"></i> Agregar Nuevo Libro</h4>
                </div>
                <div class="form-group-inline">
                    <input type="text" placeholder='Código o ID' class="form-input">
                    <input type="text" placeholder='Nombre del libro' class="form-input ">
                    <input type="text" placeholder='Categoría' class="form-input">
                    <button class="btn-admin">Guardar Libro</button>
                </div>
                
            </section>

            <section class="content-area">
                <div class="section-header">
                    <h4>Categorías</h4>
                </div>
                <div class="category-manager-box">
                    <div class="form-group-inline">
                        <input type="text" placeholder='Nueva categoría' class="form-input">
                        <button class="btn-admin">Agregar Categoría</button>
                    </div>
                </div>
            </section>
            
            <section class="content-area">
                <div class="section-header">
                    <h4><i class="fa-solid fa-list"></i> Libros Registrados</h4>
                </div>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Libro</th>
                                <th>Categoría</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>001</td>
                                <td class="ticket-bold">Libro</td>
                                <td>Novela</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>

</body>
</html>
